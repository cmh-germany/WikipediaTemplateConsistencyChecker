<tr data-key="$key" data-suppression="$suppression_index" data-rule="$rule_id">
  <td class="suppress-cell"><input type="checkbox" class="suppress-cb" title="Suppress this rule for every article"$checked><input type="text" class="reason" placeholder="Reason (optional)" value="$reason"></td>
  <td>$rule_title <span class="rule-id">($rule_id)</span></td>
</tr>
